name: Platforms

# Where floorhands can run is set by Claude Code's sandbox, which every agent requires: macOS and Linux (covered by CI and
# Permission probes) and WSL2. Native Windows is not supported by the sandbox, so floorhands must refuse there with a clear message.
# This workflow proves both on GitHub's Windows runners: the refusal on native Windows, and the full test suite plus the keyless
# permission probes inside a WSL2 Ubuntu distribution. No API key, no login.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-windows:
    name: Native Windows refuses, pointing to WSL2
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: floorhands start must exit 1 with the WSL2 message
        shell: bash
        run: |
          git config --global user.name "floorhands CI"
          git config --global user.email "ci@floorhands.invalid"
          set +e
          out=$(node bin/floorhands start 2>&1); code=$?
          set -e
          echo "$out"
          test "$code" = 1 || { echo "expected exit 1, got $code"; exit 1; }
          echo "$out" | grep -q "run floorhands inside a WSL2 distribution" || { echo "expected the WSL2 message"; exit 1; }
          test ! -e .floorhands/server.json || { echo "a server was started"; exit 1; }

  wsl2:
    name: WSL2 (Ubuntu 24.04) runs the suite and the probes
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      # Pinned to the v7.2.0 release commit: a third-party action runs with the job's token.
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: git curl ca-certificates xz-utils bubblewrap socat

      # A normal user, as a real WSL2 setup has: root ignores file permissions (a test relies on them) and never meets the
      # unprivileged user-namespace path bubblewrap takes for real users. Node is installed for everyone.
      - name: Normal user, Node 22 and the sandbox settings (as root)
        shell: wsl-bash {0}
        run: |
          set -eu
          grep -i wsl2 /proc/version
          useradd -m -s /bin/bash fh
          echo 'fh ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/fh
          v=v22.11.0
          curl -fsSL "https://nodejs.org/dist/$v/node-$v-linux-x64.tar.xz" -o /tmp/node.tar.xz
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          node --version
          # Ubuntu 24.04 restricts the user namespaces bubblewrap needs; lift it on this throwaway machine only.
          sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Work on the Linux filesystem inside WSL (not /mnt/c), where permissions, symlinks and line endings behave as on Linux.
      - name: Check out inside WSL2 (as the normal user)
        shell: wsl-bash {0}
        env:
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          # Windows environment variables reach a WSL distribution only when WSLENV names them.
          WSLENV: REF/u:REPO/u
        run: |
          set -eu
          sudo -u fh -H env REF="$REF" REPO="$REPO" bash -euc '
            git config --global user.name "floorhands CI"
            git config --global user.email "ci@floorhands.invalid"
            git config --global init.defaultBranch main
            git clone -q "https://github.com/$REPO" "$HOME/fh"
            cd "$HOME/fh"
            git fetch -q origin "$REF"
            git checkout -q FETCH_HEAD
            git log --oneline -1'

      - name: npm test inside WSL2 (as the normal user)
        shell: wsl-bash {0}
        run: sudo -u fh -H bash -euc 'cd "$HOME/fh" && id -un && npm test'

      # Claude Code at the version the probe baseline was recorded with, so a new release cannot turn an unrelated PR red
      # (the Permission probes workflow follows new releases).
      - name: Permission probes inside WSL2 (as the normal user, fake model, no key)
        shell: wsl-bash {0}
        run: |
          set -eu
          v=$(sudo -u fh -H bash -c 'cd "$HOME/fh" && node -p "require(\"./docs/spike-results-0.3.0.json\").claudeVersion.split(\" \")[0]"')
          echo "Claude Code $v"
          printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          npm install -g -q "@anthropic-ai/claude-code@$v"
          sudo -u fh -H bash -euc '
            cd "$HOME/fh"
            claude --version
            node scripts/spike-claude.mjs --fake-model --out probe-results/wsl2 || echo "probe script exited $?; the comparison decides"
            node scripts/probe-compare.mjs probe-results/wsl2.json docs/spike-results-0.3.0.json'
